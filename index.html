<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tankekarta Viewer</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f9fafb;
    }
    #diagram {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
  </style>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false });

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Läs hela parametern direkt från URL för att undvika avklippning vid &
      const match = window.location.href.match(/[?&]mermaidCode=([^#]*)/);
      
      if (match && match[1]) {
        const container = document.getElementById('diagram');
        try {
          // 2. Avkoda URL-strängen
          let cleanCode = decodeURIComponent(match[1]);

          // 3. Tvätta alla HTML-entiteter (&gt;, &lt;, &amp;, &quot;)
          cleanCode = cleanCode
            .replace(/&gt;/g, '>')
            .replace(/&lt;/g, '<')
            .replace(/&amp;/g, '&')
            .replace(/&quot;/g, '"');

          // 4. Reparera brutna pilar (--A eller --[ blir -->A eller -->[)
          cleanCode = cleanCode.replace(/--([a-zA-Z0-9_\[])/g, '-->$1');

          // 5. Ta bort alla varianter av skräpvinklar i slutet (hanterar både ]>; och ];>)
          cleanCode = cleanCode.replace(/(;\s*>+|>\s*;?|\s*>+)+$/, ';');

          // 6. Omslut alla nod-etiketter med citationstecken ["..."] för att säkra specialtecken, & och ()
          cleanCode = cleanCode.replace(/\["?([^"\]]+)"?\]/g, '["$1"]');

          // 7. Rendera diagrammet
          const { svg } = await mermaid.render('mermaid-svg', cleanCode);
          container.innerHTML = svg;
        } catch (err) {
          container.innerText = 'Kunde inte rendera diagrammet: ' + err.message;
        }
      } else {
        document.getElementById('diagram').innerText = 'Ingen mermaidCode skickades med i länken.';
      }
    });
  </script>
</head>
<body>
  <div id="diagram">Laddar tankekarta...</div>
</body>
</html>
